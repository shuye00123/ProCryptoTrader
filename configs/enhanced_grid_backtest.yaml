# 增强网格策略回测配置文件
# 基于实际测试结果优化的参数配置

# 基本设置
basic:
  start_date: "2024-01-01"     # 回测开始日期
  end_date: "2024-07-01"       # 回测结束日期
  initial_balance: 10000      # 初始资金
  benchmark: "BTC/USDT"        # 基准标的

# 数据设置
data:
  exchange: "binance"          # 交易所
  symbols:
    - "BTC/USDT"              # 交易对
  timeframes:
    - "15m"                   # 时间框架
  data_dir: "./data"          # 数据目录

# 策略设置
strategy:
  name: "EnhancedGridStrategy"    # 策略名称
  class: "EnhancedGridStrategy"   # 策略类名
  params:
    # 网格参数
    grid_count: 100               # 网格数量 (经过测试优化)
    grid_range_pct: 1         # 网格范围 20% (覆盖价格波动)
    position_size: 0.01          # 仓位大小 5%
    max_positions: 100             # 最大持仓数量

    # 风险控制
    stop_loss_pct: 0.10          # 止损 10%
    take_profit_pct: 0.25        # 止盈 25%

    # 增强功能
    rebalance_on_trade: false     # 交易后重平衡
    volatility_adjustment: false  # 波动率自适应
    smart_rebalance: false        # 智能重平衡
    rebalance_threshold_pct: 0.3 # 重平衡阈值 30%
    max_price_deviation: 0.5     # 最大价格偏离度

    # 绝对价格限制
    absolute_upper_price: 110000.0  # 绝对上限价格
    absolute_lower_price: 30000.0  # 绝对下限价格
    min_range_pct: 0.01             # 最小网格范围 5%
    max_range_pct: 1             # 最大网格范围 100%

# 交易设置
trading:
  commission: 0.001            # 手续费率 0.1%
  slippage: 0.0005             # 滑点 0.05%
  leverage: 1                  # 杠杆倍数
  position_size: 0.01          # 仓位大小 (与策略参数一致)
  max_position_size: 1      # 最大仓位大小

# 风控设置
risk:
  max_drawdown: 0.25           # 最大回撤 25%
  max_loss_per_trade: 0.05     # 单笔最大亏损 5%
  max_loss_per_day: 0.10       # 单日最大亏损 10%
  max_open_positions: 5        # 最大持仓数量

# 输出设置
output:
  save_trades: true            # 保存交易记录
  save_performance: true       # 保存绩效指标
  save_plots: true             # 保存图表
  output_dir: "./results/enhanced_grid"  # 输出目录
  plot_format: "png"           # 图表格式

# 日志设置
logging:
  level: "INFO"                # 日志级别
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/enhanced_grid_backtest.log"  # 日志文件
  console: true                # 控制台输出

# 并行设置
parallel:
  enabled: false               # 是否启用并行
  n_jobs: 4                    # 并行任务数

# 其他设置
misc:
  random_seed: 42              # 随机种子
  verbose: true                # 详细输出

# 增强网格策略特定配置
enhanced_grid:
  # 波动率分析
  volatility_period: 20         # 波动率计算周期
  volatility_threshold: 0.02    # 波动率阈值

  # 重平衡策略
  rebalance_strategy: "adaptive"  # 重平衡策略: adaptive/fixed
  rebalance_cooldown: 100       # 重平衡冷却时间 (分钟)

  # 网格优化
  dynamic_grid_spacing: true   # 动态网格间距
  grid_density_factor: 1.0     # 网格密度因子

  # 性能监控
  enable_monitoring: true      # 启用性能监控
  checkpoint_interval: 1000    # 检查点间隔