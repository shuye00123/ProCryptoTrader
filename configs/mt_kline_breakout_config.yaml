# 多时间框架K线突破策略配置
# 策略特性：使用1秒K线数据 + 多时间框架技术指标确认

# 基础配置
basic:
  mode: "paper"                 # 运行模式: paper(模拟), live(实盘), backtest(回测)
  strategy: "MultiTimeframeKlineBreakout"
  initial_balance: 10000.0
  max_drawdown: 0.1
  max_daily_loss: 0.03

# 交易规模配置
trading:
  target_trade_value_usdt: 100.0
  min_trade_value_usdt: 50.0
  max_trade_value_usdt: 500.0
  max_total_value_usdt: 1000.0
  max_daily_value_usdt: 2000.0

# 策略配置
strategy:
  name: "MultiTimeframeKlineBreakout"
  class: "MultiTimeframeKlineBreakout"

  # 基础参数
  max_positions: 3                # 最大持仓数量
  position_size: 0.02             # 每次开仓比例 (2%)
  max_position_size: 0.05         # 单个持仓最大比例 (5%)
  max_total_exposure: 0.15        # 最大总敞口 (15%)
  signal_cooldown: 30             # 信号冷却期（秒）

  # ==================== 1秒K线突破检测配置 ====================
  kline_breakout:
    enabled: true
    window_size: 200              # 200个1秒K线 = 3.3分钟
    min_breakout_strength: 2.5    # 最小突破强度（平衡阈值）
    volume_threshold: 2.0
    consecutive_moves_threshold: 5
    breakout_cooldown: 30000      # 30秒per-symbol冷却期

    # 多重确认机制
    require_multiple_confirmation: true
    min_confirmation_count: 2     # 需要2个算法确认
    confirmation_window: 5000     # 5秒确认窗口

    # 统计突破参数（平衡版）
    statistical_breakout:
      enabled: true
      price_deviation_threshold: 2.8   # 平衡Z阈值
      momentum_ratio_threshold: 2.5

    # 连续变动突破参数
    consecutive_breakout:
      enabled: true
      min_consecutive_moves: 5
      min_move_threshold: 0.001

    # 成交量突破参数（平衡版 - 基于GMTUSDT数据分析）
    volume_breakout:
      enabled: true
      volume_surge_threshold: 3.0      # 平衡Volume阈值
      min_price_change: 0.008
      min_avg_volume: 1
      min_data_points: 100

    # 路径突破参数
    path_breakout:
      enabled: true
      breakout_threshold: 0.005
      support_resistance_window: 50
      min_data_points: 50
      virtual_level_offset: 0.001

  # ==================== 多时间框架确认配置 ====================
  multi_timeframe:
    enabled: true
    timeframes: ['15m', '1h', '1d']
    min_timeframes: 2            # 至少2个时间框架确认
    min_indicators: 3            # 至少3个技术指标确认

    # 指标阈值（平衡版）
    rsi_min: 30                  # RSI最小值（避免超卖）
    rsi_max: 70                  # RSI最大值（避免超买）
    bb_position_min: 0.7         # 布林带位置最小值
    volume_ratio_min: 1.5        # 成交量比率最小值
    momentum_min: 0.002          # 动量最小值

    # 15分钟指标配置
    timeframe_15m:
      enabled: true
      indicators: ['SMA_5_15', 'BOLLINGER', 'RSI']
      weights:
        SMA_5_15: 0.4
        BOLLINGER: 0.3
        RSI: 0.3

    # 1小时指标配置
    timeframe_1h:
      enabled: true
      indicators: ['EMA_12_26', 'MACD', 'VOLUME_TREND']
      weights:
        EMA_12_26: 0.4
        MACD: 0.4
        VOLUME_TREND: 0.2

    # 1日指标配置（可选，大趋势过滤）
    timeframe_1d:
      enabled: false             # 默认禁用日线确认
      indicators: ['TREND_DIRECTION', 'KEY_LEVELS']
      weights:
        TREND_DIRECTION: 0.6
        KEY_LEVELS: 0.4

  # 原有突破检测器（保持关闭）
  breakout:
    enabled: false
    lookback_period: 50
    volume_threshold: 1.5
    volatility_threshold: 0.02
    momentum_threshold: 0.01
    support_resistance_lookback: 100
    min_breakout_strength: 0.6

  # 风险管理
  risk_management:
    max_drawdown: 0.1
    max_daily_loss: 0.03
    position_risk_limit: 0.02
    use_trailing_stop: true
    trailing_stop_distance: 0.02

  # 信号过滤器
  signal_filters:
    enabled: true
    min_signal_quality: 0.6
    max_signals_per_minute: 2
    duplicate_signal_filter: true
    require_volume_confirmation: true
    min_confirmation_count: 2
    quality_score_threshold: 0.75

# 交易所配置
exchange:
  api_key: ""
  api_secret: ""
  sandbox: false
  testnet: false

  websocket:
    reconnect_attempts: 10
    reconnect_delay: 5000
    connection_timeout: 10000
    ping_interval: 30000
    subscription_limit: 100

# 执行引擎配置
execution:
  enable_batch_execution: false
  default_timeout: 5000
  max_queue_size: 1000
  enable_order_validation: true
  default_priority: "HIGH"
  max_retries: 2
  retry_delay: 100

# 监控和统计
monitoring:
  enable_performance_monitoring: true
  stats_update_interval: 10
  log_level: "INFO"
  log_executed_orders: true
  log_signal_details: true
  enable_realtime_stats: true
  stats_save_interval: 300

# 交易对配置
symbols:
  - "BTC-USDT"
  - "ETH-USDT"
  - "BNB-USDT"

# WebSocket订阅配置
websocket_subscribe:
  enabled: true
  whitelist:
    - "BTCUSDT"
    - "ETHUSDT"
    - "BNBUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "AVAXUSDT"
    - "DOTUSDT"
    - "MATICUSDT"
    - "LINKUSDT"
    - "ATOMUSDT"

# 风险控制
risk_control:
  max_position_value: 1000
  max_total_position_value: 3000
  default_stop_loss: 0.05
  default_take_profit: 0.1
  max_holding_time: 3600
  max_volatility_threshold: 0.05
  volatility_stop: true

# 数据源配置
data_source:
  type: "binance"
  enable_data_validation: true
  max_data_delay: 1000

# 输出配置
output:
  save_results: true
  results_dir: "./results/mt_kline_breakout"
  generate_reports: true
  report_interval: 300
  save_stats: true
  stats_format: "json"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/mt_kline_breakout.log"
  max_file_size: "10MB"
  backup_count: 5
  console: true
  modules:
    "MultiTimeframeKlineBreakout": "INFO"
    "core.strategy.kline_breakout_detector": "INFO"
    "core.strategy.multi_timeframe_confirmator": "INFO"
    "core.trading.fast_execution": "INFO"

# 通知配置
notifications:
  enabled: false
  webhook_url: ""
  events:
    - "signal_generated"
    - "order_executed"
    - "risk_limit_hit"
    - "system_error"

# Tick数据转存配置（可选）
tick_data_persistence:
  enabled: false

  storage:
    base_path: "data/tick"
    exchange: "binance"
    compression: "snappy"
    file_split_hours: 1

  buffer:
    max_size_mb: 150
    max_ticks_per_symbol: 50000
    cleanup_ratio: 0.8

  performance:
    batch_size: 5000
    max_concurrent_writes: 1
    write_timeout_seconds: 120

  integrity:
    enable_validation: true
    checksum_enabled: true
    auto_repair: false

  monitoring:
    enable_metrics: true
    log_level: "INFO"
    alert_memory_threshold: 80
