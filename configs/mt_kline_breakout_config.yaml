# 多时间框架K线突破策略配置
# 策略特性：使用1秒K线数据 + 多时间框架技术指标确认

# 基础配置
basic:
  mode: "paper"                 # 运行模式: paper(模拟), live(实盘), backtest(回测)
  strategy: "MultiTimeframeKlineBreakout"
  initial_balance: 10000.0
  max_drawdown: 0.1
  max_daily_loss: 0.03

# 交易规模配置
trading:
  target_trade_value_usdt: 100.0
  min_trade_value_usdt: 50.0
  max_trade_value_usdt: 500.0
  max_total_value_usdt: 1000.0
  max_daily_value_usdt: 2000.0

# 策略配置
strategy:
  name: "MultiTimeframeKlineBreakout"
  class: "MultiTimeframeKlineBreakout"

  # 基础参数
  max_positions: 3                # 最大持仓数量
  position_size: 0.02             # 每次开仓比例 (2%)
  max_position_size: 0.05         # 单个持仓最大比例 (5%)
  max_total_exposure: 0.15        # 最大总敞口 (15%)
  signal_cooldown: 60             # ✅ 修改为60秒冷却期（验证过最优）

  # ==================== 1秒K线突破检测配置 ====================
  kline_breakout:
    enabled: true
    window_size: 200              # 200个1秒K线 = 3.3分钟
    min_breakout_strength: 2.5    # 最小突破强度（平衡阈值）
    volume_threshold: 3.0         # ✅ 修改为3.0x（验证过最优）
    consecutive_moves_threshold: 5
    breakout_cooldown: 60000      # ✅ 修改为60秒冷却期（60000ms）

    # 多重确认机制
    require_multiple_confirmation: false  # ✅ 简化：禁用多重确认
    min_confirmation_count: 1     # ✅ 只需要1个算法确认
    confirmation_window: 5000     # 5秒确认窗口

    # ✅ 简化：禁用其他突破检测算法，只保留布林带突破 + 成交量激增
    # 统计突破参数
    statistical_breakout:
      enabled: false              # ✅ 禁用，简化逻辑

    # 连续变动突破参数
    consecutive_breakout:
      enabled: false              # ✅ 禁用，简化逻辑

    # ✅ 成交量突破参数（保持启用 - 经过验证的关键参数）
    volume_breakout:
      enabled: true               # ✅ 保留
      volume_surge_threshold: 3.0  # ✅ 3.0x阈值（验证过最优）
      min_price_change: 0.005     # ✅ 降低到0.5%
      min_avg_volume: 1
      min_data_points: 100

    # 路径突破参数
    path_breakout:
      enabled: false              # ✅ 禁用，简化逻辑

  # ==================== 多时间框架确认配置 ====================
  multi_timeframe:
    enabled: true
    timeframes: ['15m', '1h', '1d']
    min_timeframes: 2            # 至少2个时间框架确认
    min_indicators: 3            # 至少3个技术指标确认

    # 指标阈值（平衡版）
    rsi_min: 30                  # RSI最小值（避免超卖）
    rsi_max: 70                  # RSI最大值（避免超买）
    bb_position_min: 0.7         # 布林带位置最小值
    volume_ratio_min: 1.5        # 成交量比率最小值
    momentum_min: 0.002          # 动量最小值

    # 15分钟指标配置
    timeframe_15m:
      enabled: true
      indicators: ['SMA_5_15', 'BOLLINGER', 'RSI']
      weights:
        SMA_5_15: 0.4
        BOLLINGER: 0.3
        RSI: 0.3

    # 1小时指标配置
    timeframe_1h:
      enabled: true
      indicators: ['EMA_12_26', 'MACD', 'VOLUME_TREND']
      weights:
        EMA_12_26: 0.4
        MACD: 0.4
        VOLUME_TREND: 0.2

    # 1日指标配置（可选，大趋势过滤）
    timeframe_1d:
      enabled: false             # 默认禁用日线确认
      indicators: ['TREND_DIRECTION', 'KEY_LEVELS']
      weights:
        TREND_DIRECTION: 0.6
        KEY_LEVELS: 0.4

  # 原有突破检测器（保持关闭）
  breakout:
    enabled: false
    lookback_period: 50
    volume_threshold: 1.5
    volatility_threshold: 0.02
    momentum_threshold: 0.01
    support_resistance_lookback: 100
    min_breakout_strength: 0.6

  # 风险管理
  risk_management:
    max_drawdown: 0.1
    max_daily_loss: 0.03
    position_risk_limit: 0.02
    use_trailing_stop: true
    trailing_stop_distance: 0.02

  # 信号过滤器
  signal_filters:
    enabled: true
    min_signal_quality: 0.6
    max_signals_per_minute: 2
    duplicate_signal_filter: true
    require_volume_confirmation: true
    min_confirmation_count: 2
    quality_score_threshold: 0.75

  # ✅ 新增：真假突破分类配置（Phase 2功能）
  breakout_classification:
    enabled: false              # 默认禁用，等Phase 2实现时启用
    hold_duration_ticks: 100    # 观察100tick
    true_breakout_threshold: 0.005   # 0.5%真突破目标
    false_breakout_threshold: -0.003  # -0.3%假突破止损

# 交易所配置
exchange:
  api_key: ""
  api_secret: ""
  sandbox: false
  testnet: false

  websocket:
    reconnect_attempts: 10
    reconnect_delay: 5000
    connection_timeout: 10000
    ping_interval: 30000
    subscription_limit: 100

# 执行引擎配置
execution:
  enable_batch_execution: false
  default_timeout: 5000
  max_queue_size: 1000
  enable_order_validation: true
  default_priority: "HIGH"
  max_retries: 2
  retry_delay: 100

# 监控和统计
monitoring:
  enable_performance_monitoring: true
  stats_update_interval: 10
  log_level: "INFO"
  log_executed_orders: true
  log_signal_details: true
  enable_realtime_stats: true
  stats_save_interval: 300

# 交易对配置
symbols:
  - "AUTO"  # 🔥 全市场自动订阅模式（推荐）

  # 或者手动指定交易对（注释掉上面的 AUTO）
  # - "BTC-USDT"
  # - "ETH-USDT"
  # - "BNB-USDT"

# WebSocket订阅配置
websocket_subscribe:
  enabled: true

  # 🔥 全市场订阅配置（当 symbols 设置为 "AUTO" 时生效）
  all_market:
    enabled: true              # 启用全市场订阅
    quote_asset: "USDT"        # 报价资产（USDT/BUSD/USDC等）
    min_volume_24h:     # 24小时最小成交量过滤（USDT），设为null不过滤
    min_price:           # 最小价格过滤（可选），设为null不过滤
    max_price:          # 最大价格过滤（可选），设为null不过滤
    exclude_symbols:           # 排除的交易对列表（可选）
      - "USDCUSDT"             # 排除稳定币对
      - "TUSDUSDT"
      - "BUSDUSDT"
      - "BTCDOMUSDT"           # 排除指数
      - "ETHDOMUSDT"

  # ⚠️ 白名单模式（手动指定时使用，全市场模式下自动忽略）
  whitelist:
    - "BTCUSDT"
    - "ETHUSDT"
    - "BNBUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "AVAXUSDT"
    - "DOTUSDT"
    - "MATICUSDT"
    - "LINKUSDT"
    - "ATOMUSDT"

# 风险控制
risk_control:
  max_position_value: 1000
  max_total_position_value: 3000
  default_stop_loss: 0.05
  default_take_profit: 0.1
  max_holding_time: 3600
  max_volatility_threshold: 0.05
  volatility_stop: true

# 数据源配置
data_source:
  type: "binance"
  enable_data_validation: true
  max_data_delay: 1000

# 输出配置
output:
  save_results: true
  results_dir: "./results/mt_kline_breakout"
  generate_reports: true
  report_interval: 300
  save_stats: true
  stats_format: "json"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/mt_kline_breakout.log"
  max_file_size: "10MB"
  backup_count: 5
  console: true
  modules:
    "MultiTimeframeKlineBreakout": "INFO"
    "core.strategy.kline_breakout_detector": "INFO"
    "core.strategy.multi_timeframe_confirmator": "INFO"
    "core.trading.fast_execution": "INFO"

# 通知配置
notifications:
  enabled: true  # 🆕 启用webhook通知
  webhook_url: ""  # 🆕 请替换为你的webhook URL
  platform: "feishu"  # 支持的平台: feishu, dingtalk, wechat_work, slack

  # 通知事件配置
  events:
    system_startup: true      # 🆕 系统启动通知
    system_shutdown: true     # 🆕 系统关闭通知
    signal_generated: true    # 🆕 信号生成通知
    order_submitted: true     # 🆕 订单提交通知
    order_failed: true        # 🆕 订单失败通知
    error_alert: true         # 🆕 错误告警

# ==================== 性能优化配置（Phase 0-6） ====================
# 多时间框架订阅配置
multi_timeframe_subscription:
  enabled: true
  timeframes:
    - interval: "1s"
      enabled: true
      purpose: "breakout_detection"
    - interval: "15m"
      enabled: true
      purpose: "indicator_calculation"
    - interval: "1h"
      enabled: true
      purpose: "indicator_calculation"
  max_reconnect_attempts: 5
  reconnect_delay_ms: 1000
  enable_stats: true

# 指标缓存配置
indicator_cache:
  enabled: true
  mode: "default"              # default, aggressive, conservative
  max_age_seconds: 3600        # 缓存最大有效期（默认1小时）
  update_on_kline_close: true  # 只在K线闭合时更新
  enable_stats: true
  cleanup_interval: 300        # 清理间隔（秒）

# 缓存模式配置（preset）
cache_presets:
  default:
    max_age_seconds: 3600      # 1小时
    cleanup_interval: 300      # 5分钟
  aggressive:
    max_age_seconds: 7200      # 2小时（更激进）
    cleanup_interval: 600      # 10分钟
  conservative:
    max_age_seconds: 1800      # 30分钟（更保守）
    cleanup_interval: 180      # 3分钟

# 性能监控配置
performance:
  enable_metrics: true
  log_cache_hit_rate: true
  log_calculation_time: true
  log_processing_stats: true
  stats_update_interval: 60    # 统计更新间隔（秒）
  print_statistics_on_stop: true

# 数据提供者配置
data_provider:
  backtest:
    data_dir: "data"
    cache_enabled: true
    validate_data: true
  realtime:
    enable_rest_api_fallback: false   # Phase 4实现
    warmup_periods: 200                # 预热数据周期数
    max_cache_size: 500                # K线缓存最大数量

# Tick数据转存配置（可选）
tick_data_persistence:
  enabled: false

  storage:
    base_path: "data/tick"
    exchange: "binance"
    compression: "snappy"
    file_split_hours: 1

  buffer:
    max_size_mb: 150
    max_ticks_per_symbol: 50000
    cleanup_ratio: 0.8

  performance:
    batch_size: 5000
    max_concurrent_writes: 1
    write_timeout_seconds: 120

  integrity:
    enable_validation: true
    checksum_enabled: true
    auto_repair: false

  monitoring:
    enable_metrics: true
    log_level: "INFO"
    alert_memory_threshold: 80
